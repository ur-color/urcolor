name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch cancels the first: the older run's verdict is
# about code nobody will merge.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --frozen-lockfile so a manifest edited without regenerating bun.lock
      # fails here, rather than resolving to something different in CI than it
      # does locally.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      # Catches what the tests cannot: a type error in an unexported path, a
      # package whose entry point does not resolve, a broken d.ts emit.
      - name: Build packages
        run: bun run build
