# Stage the next release: work out each package's version from its commits,
# write the changelog entries, and open a pull request with the result.
#
# Deliberately a pull request rather than a push to main. Merging it lands the
# version bumps, which is exactly what the publish-<package>.yml workflows
# trigger on — so the release path is unchanged and nothing publishes without a
# human merging first. It is also where the generated one-line entries get
# rewritten into the prose these changelogs are written in.
name: Prepare release

on:
  workflow_dispatch:
  # Weekly, so a run of small fixes does not sit unreleased indefinitely. The
  # PR is a no-op when nothing user-facing landed.
  schedule:
    - cron: '0 9 * * 1'

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history and tags: the version baseline is the tag a package was
          # last published under, and a shallow clone has neither.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Work out versions and write changelog entries
        id: prepare
        run: |
          bun run scripts/prepare-release.ts | tee /tmp/prepare.log
          if [ -s release-summary.txt ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            {
              echo 'summary<<SUMMARY_EOF'
              cat release-summary.txt
              echo 'SUMMARY_EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
          rm -f release-summary.txt

      - name: Open the release pull request
        if: steps.prepare.outputs.released == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: release/prepare
          # Recreated each run rather than appended to, so the PR always
          # reflects the current state of main rather than an older reading.
          delete-branch: true
          title: 'chore(release): stage the next versions'
          commit-message: 'chore(release): stage the next versions'
          body: |
            Versions derived from Conventional Commits since each package's last
            release tag, with changelog entries generated from the same commits.

            ```
            ${{ steps.prepare.outputs.summary }}
            ```

            The generated entries are appended under `## Unreleased`, below
            anything already written there — they are a floor, not a
            replacement. **Rewrite them into prose before merging**: a commit
            subject says what changed, and these changelogs say why.

            Merging bumps the versions on main, which is what the
            `publish-<package>.yml` workflows trigger on.

      - name: Report when there is nothing to release
        if: steps.prepare.outputs.released != 'true'
        run: echo "No user-facing commits since the last release — no pull request opened."
